name: EbarCity Athletics Android Release CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js & Build Web Assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies & Build Web Project
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Copy Web Build to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Decode Android Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/ebarcity-release-key.jks
            echo "Keystore successfully decoded from GitHub Secrets."
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret not found. Generating auto-keystore..."
            keytool -genkey -v -keystore android/app/keystore/ebarcity-release-key.jks \
              -alias ebarkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass default_password -keypass default_password \
              -dname "CN=Akbar Alimiri, OU=EbarCity Athletics, O=FB NewMeta Tavana City, L=Tehran, C=IR"
          fi

      - name: Install Gradle & Generate Wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          cd android
          gradle wrapper --gradle-version 8.5

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew || chmod +x android/gradlew.bat || true

      - name: Build Release APK & AAB with Gradle
        working-directory: ./android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || 'default_password' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'ebarkey' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'default_password' }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease -Djava.awt.headless=true --no-daemon
          else
            echo "Gradle wrapper not initialised. Running fallback."
          fi

      - name: Stage APK for Artifact Download
        run: |
          mkdir -p staged-apk
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} staged-apk/ebarcity-athletics-release.apk \;
          ls -lh staged-apk/

      - name: Upload Direct APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebarcity-athletics-release-apk
          path: staged-apk/ebarcity-athletics-release.apk

      - name: Upload AAB (Bundle for Cafe Bazaar & Myket) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebarcity-athletics-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
